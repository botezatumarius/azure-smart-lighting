# Publish only the dashboard and read endpoints. Uploads use SSH port forwarding.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    location ~ ^/(|dashboard\.js|results|counts\.csv|latest\.jpg|health)$ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 30s;
    }

    location / { return 404; }
}
